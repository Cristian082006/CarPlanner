name: car_planner
description: "Aplicatie pentru gestionarea masinilor: revizii, carte service, documente si remindere."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  image_picker: ^1.1.2
  intl: ^0.19.0
  uuid: ^4.4.0
  add_2_calendar: ^3.0.1
  google_mlkit_text_recognition: ^0.16.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.1
  file_picker: ^11.0.2
  printing: ^5.13.4
  open_filex: ^4.5.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.2
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic-Variable.ttf
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/icon_background.png
  adaptive_icon_foreground: assets/icon/icon_foreground.png
